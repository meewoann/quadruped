base_to_footprint_ekf:
  ros__parameters:
    frequency: 50.0
    publish_tf: true
    transform_timeout: 0.01
    transform_time_offset: 0.045
    two_d_mode: false
    # diagnostics_agg: true

    #x     , y     , z,
    #roll  , pitch , yaw,
    #vx    , vy    , vz,
    #vroll , vpitch, vyaw,
    #ax    , ay    , az

    pose0: base_to_footprint_pose
    pose0_config: [true,  true,  true,
                  true,  true,  true,
                  false, false, false,
                  false, false, false,
                  false, false, false]

    # Fuse roll/pitch orientation + all angular velocities from IMU.
    # (NOT vx/vy/vz — sensor_msgs/Imu doesn't carry linear velocities.)
    imu0: imu/data
    imu0_config: [false, false, false,
                   true,  true, false,
                  false, false, false,
                   true,  true,  true,
                  false, false, false]

    odom_frame: base_footprint
    world_frame: base_footprint